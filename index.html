<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https:; img-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Pickle</title>
<meta name="description" data-t-content="Pickle: good things take time. A weight-loss tracker: a meal plan, a photo and text food log, and daily tracking. Entries, photos and settings are stored on this device." content="Pickle: good things take time. A weight-loss tracker: a meal plan, a photo and text food log, and daily tracking. Entries, photos and settings are stored on this device.">
<meta name="theme-color" content="#F2F1EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121915" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pickle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="alternate icon" href="icons/icon-192.png" type="image/png">
<link rel="preload" href="fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>

  <form id="composer" class="composer" autocomplete="off" hidden>
    <div class="hints" role="group" aria-label="Things you can type" data-t-aria="Things you can type">
      <span class="hints-label" data-t="Examples">Examples</span>
      <button type="button" class="chip" data-act="hint" data-fill="85.4" data-t-fill="85.4" data-t="Weight: 85.4">Weight: 85.4</button>
      <button type="button" class="chip" data-act="hint" data-fill="8200 steps" data-t-fill="8200 steps" data-t="8200 steps">8200 steps</button>
      <button type="button" class="chip" data-act="hint" data-fill="water 2 glasses" data-t-fill="water 2 glasses" data-t="Water 2 glasses">Water 2 glasses</button>
      <button type="button" class="chip" data-act="hint" data-fill="2 coffees" data-t-fill="2 coffees" data-t="2 coffees">2 coffees</button>
      <button type="button" class="chip" data-act="hint" data-fill="workout" data-t-fill="workout" data-t="Workout">Workout</button>
      <button type="button" class="chip" data-act="hint" data-fill="2 slices of pizza and a beer" data-t-fill="2 slices of pizza and a beer" data-t="2 slices of pizza and a beer">2 slices of pizza and a beer</button>
    </div>
    <div id="favorites" class="favorites" hidden></div>
    <div class="composer-row">
      <button type="button" class="icon-btn camera-btn" id="btn-cam" aria-label="Take a photo" data-t-aria="Take a photo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1-1.6A1.5 1.5 0 0 1 10 3.7h4a1.5 1.5 0 0 1 1.3.7l1 1.6h1.2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.4" r="3.4"/></svg>
      </button>
      <button type="button" class="icon-btn" id="btn-lib" aria-label="Choose from library" data-t-aria="Choose from library">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="m4 16 4.6-4.6a1.5 1.5 0 0 1 2.1 0L15 15.7"/><path d="m13.5 14.2 1.6-1.6a1.5 1.5 0 0 1 2.1 0L20.5 16"/><circle cx="15.5" cy="9.2" r="1.3"/></svg>
      </button>
      <label class="sr-only" for="composer-input" data-t="What you ate, or your weight">What you ate, or your weight</label>
      <input id="composer-input" type="text" inputmode="text" enterkeyhint="send" placeholder="What did you eat?" data-t-placeholder="What did you eat?">
      <button type="submit" class="icon-btn send-btn" aria-label="Send" data-t-aria="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg>
      </button>
    </div>
  </form>

  <nav class="tabs" aria-label="Sections" data-t-aria="Sections">
    <button type="button" data-tab="today" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg><span data-t="Today">Today</span>
    </button>
    <button type="button" data-tab="log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h14M5 12h14M5 17.5h9"/></svg><span data-t="Log">Log</span>
    </button>
    <button type="button" data-tab="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18"/><path d="M5 18V9M9 18v-5M13 18v-3M17 18V6"/></svg><span data-t="Progress">Progress</span>
    </button>
    <button type="button" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="4" width="14" height="16"/><path d="M9 9h6M9 12.5h6M9 16h3.5"/></svg><span data-t="Plan">Plan</span>
    </button>
    <button type="button" data-tab="check">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5V4h4.5M15.5 4H20v4.5M20 15.5V20h-4.5M8.5 20H4v-4.5"/><path d="m8.5 12.3 2.4 2.4 4.6-5.2"/></svg><span data-t="Check">Check</span>
    </button>
  </nav>
</div>

<!-- Outside #app, which is inert while a sheet is open, and outside the composer, which is hidden on some screens: the pickers are also opened from Plan and Check -->
<input id="f-cam" class="file-input" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input id="f-lib" class="file-input" type="file" accept="image/*" multiple tabindex="-1" aria-hidden="true">

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close-sheet></div>
  <div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="sheet-title" id="sheet-body"></div>
</div>
<div id="toast" class="toast" hidden></div>
<!-- Always rendered, so a screen reader announces each toast; the toast itself is hidden when it is not showing -->
<div id="toast-live" class="sr-only" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
